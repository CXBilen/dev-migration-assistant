appId: com.cxbilen.devmigrationassistant
productName: Dev Migration Assistant
copyright: Copyright © 2026 Cem Bilen
directories:
  buildResources: build
  output: release
files:
  - out/**
  - package.json
  - '!**/*.map'
asar: true
asarUnpack:
  - '**/*.node'
  - '**/hash-wasm/**'
npmRebuild: false
# Electron fuses (ADR-0007, docs/research/electron-security.md §9). electron-builder flips them after
# packaging and right before signing, so the code signature covers the flipped bits.
#   runAsNode / nodeOptions / nodeCliInspect off  → ELECTRON_RUN_AS_NODE, NODE_OPTIONS and --inspect are ignored
#   embeddedAsarIntegrityValidation + onlyLoadAppFromAsar on → only the hash-validated app.asar is ever loaded
#   grantFileProtocolExtraPrivileges stays on while the renderer is served from file:// (flip once a custom scheme is used)
#   resetAdHocDarwinSignature re-applies the ad-hoc signature after flipping on Apple Silicon (unsigned local builds)
# Verify a packaged app with: npx @electron/fuses read --app "release/mac-arm64/Dev Migration Assistant.app"
electronFuses:
  runAsNode: false
  enableCookieEncryption: true
  enableNodeOptionsEnvironmentVariable: false
  enableNodeCliInspectArguments: false
  enableEmbeddedAsarIntegrityValidation: true
  onlyLoadAppFromAsar: true
  loadBrowserProcessSpecificV8Snapshot: false
  grantFileProtocolExtraPrivileges: true
  resetAdHocDarwinSignature: true
# Ad-hoc signs unsigned contributor/alpha builds so Gatekeeper offers "Open Anyway" instead of "damaged".
afterPack: scripts/after-pack.cjs
mac:
  category: public.app-category.developer-tools
  target:
    - target: dmg
      arch: [arm64]
  # Hardened runtime requires a real Developer ID signature: unsigned local builds keep it off, because an
  # unsigned/ad-hoc app with the hardened runtime may refuse to launch (library validation against Apple-signed
  # Electron frameworks). The signed CI config (electron-builder.ci-signed.yml, generated by release.yml) sets
  # `hardenedRuntime: true` together with `notarize` and `forceCodeSigning: true`; the entitlements below
  # (allow-jit, allow-unsigned-executable-memory, disable-library-validation) are what Electron needs under it.
  hardenedRuntime: false
  gatekeeperAssess: false
  entitlements: build/entitlements.mac.plist
  entitlementsInherit: build/entitlements.mac.plist
  darkModeSupport: true
  minimumSystemVersion: '13.0'
  extendInfo:
    NSDesktopFolderUsageDescription: 'Dev Migration Assistant backs up project folders you select.'
    NSDocumentsFolderUsageDescription: 'Dev Migration Assistant backs up project folders you select and saves .devbackup files where you choose.'
    NSDownloadsFolderUsageDescription: 'Dev Migration Assistant reads and writes .devbackup files you choose.'
    NSRemovableVolumesUsageDescription: 'Dev Migration Assistant reads and writes .devbackup files on external drives you choose.'
  # Signing / notarization are configured via environment (see docs/release/RELEASE.md);
  # local contributor builds are unsigned: CSC_IDENTITY_AUTO_DISCOVERY=false
  notarize: false
dmg:
  sign: false
  # Drag-and-drop layout: app on the left, Applications shortcut on the right, arrow drawn in the background image.
  background: build/background.png
  icon: build/icon.icns
  iconSize: 128
  window:
    width: 660
    height: 450
  contents:
    - x: 160
      y: 210
      type: file
    - x: 500
      y: 210
      type: link
      path: /Applications
publish: null
