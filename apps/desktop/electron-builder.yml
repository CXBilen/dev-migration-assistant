appId: com.cxbilen.devmigrationassistant
productName: Dev Migration Assistant
copyright: Copyright © 2026 Cem Bilen
directories:
  buildResources: build
  output: release
files:
  - out/**
  - package.json
  - '!**/*.map'
asar: true
asarUnpack:
  - '**/*.node'
  - '**/hash-wasm/**'
npmRebuild: false
mac:
  category: public.app-category.developer-tools
  target:
    - target: dmg
      arch: [arm64]
  hardenedRuntime: true
  gatekeeperAssess: false
  entitlements: build/entitlements.mac.plist
  entitlementsInherit: build/entitlements.mac.plist
  darkModeSupport: true
  minimumSystemVersion: '13.0'
  # Signing / notarization are configured via environment (see docs/release/RELEASE.md);
  # local contributor builds are unsigned: CSC_IDENTITY_AUTO_DISCOVERY=false
  notarize: false
dmg:
  sign: false
  # Drag-and-drop layout: app on the left, Applications shortcut on the right, arrow drawn in the background image.
  background: build/background.png
  icon: build/icon.icns
  iconSize: 128
  window:
    width: 660
    height: 420
  contents:
    - x: 160
      y: 210
      type: file
    - x: 500
      y: 210
      type: link
      path: /Applications
publish: null
